name: Build OpenWrt 22.03 - Xiaomi CR6609

on:
  workflow_dispatch:
  push:
    paths:
      - ".config"
      - "diy-part1.sh"
      - "diy-part2.sh"
      - ".github/workflows/build-22.03.yml"

permissions:
  contents: read

concurrency:
  group: cr6609-openwrt-22-03-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_REPO: https://github.com/openwrt/openwrt.git
  SOURCE_BRANCH: openwrt-22.03
  DEVICE_TARGET: ramips
  DEVICE_SUBTARGET: mt7621

jobs:
  build:
    name: Build Xiaomi CR6609
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout configuration
        uses: actions/checkout@v4

      - name: Free disk space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          swap-size-mb: 2048
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail

          echo "Disk space before cleanup:"
          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "Disk space after cleanup:"
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-dev \
            python3-setuptools rsync swig time unzip wget xsltproc \
            zlib1g-dev file ccache ecj fastjar libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libreadline-dev libtool libyaml-dev make \
            patch pkgconf subversion uglifyjs upx-ucl squashfs-tools \
            curl ca-certificates
          sudo apt-get clean
          df -h /

      - name: Clone OpenWrt 22.03
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --single-branch \
            --branch "$SOURCE_BRANCH" "$SOURCE_REPO" openwrt
          cd openwrt
          git log -1 --oneline

      - name: Check input files and copy configuration
        shell: bash
        run: |
          set -euxo pipefail
          cp .config openwrt/.config
          test -s .config
          test -f diy-part1.sh
          test -f diy-part2.sh

          grep -q '^CONFIG_TARGET_ramips=y' .config
          grep -q '^CONFIG_TARGET_ramips_mt7621=y' .config
          grep -q '^CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-cr6609=y' .config

          cp .config openwrt/.config
          chmod +x diy-part1.sh diy-part2.sh

      - name: Run DIY part 1
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          bash "$GITHUB_WORKSPACE/diy-part1.sh"

      - name: Update and install feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Run DIY part 2
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          bash "$GITHUB_WORKSPACE/diy-part2.sh"

      - name: Configure and verify CR6609 target
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          make defconfig

          grep -q '^CONFIG_TARGET_ramips=y' .config
          grep -q '^CONFIG_TARGET_ramips_mt7621=y' .config
          grep -q '^CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-cr6609=y' .config || {
            echo "::error::After make defconfig, the selected device is not Xiaomi CR6609."
            grep -E '^CONFIG_TARGET_(ramips|ramips_mt7621)|^CONFIG_TARGET_DEVICE' .config || true
            exit 1
          }

          echo "Verified target:"
          grep -E '^CONFIG_TARGET_(ramips|ramips_mt7621)|^CONFIG_TARGET_DEVICE' .config

      - name: Build firmware
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail
          make -j2 V=s 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect firmware and build diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/firmware-output"
          BUILD_DIR="$GITHUB_WORKSPACE/openwrt/bin/targets/$DEVICE_TARGET/$DEVICE_SUBTARGET"

          if [ -d "$BUILD_DIR" ]; then
            cp -a "$BUILD_DIR/." "$GITHUB_WORKSPACE/firmware-output/"
          fi

          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            cp "$GITHUB_WORKSPACE/build.log" "$GITHUB_WORKSPACE/firmware-output/"
          fi

          if [ -d "$GITHUB_WORKSPACE/firmware-output" ]; then
            cd "$GITHUB_WORKSPACE/firmware-output"
            find . -type f -print
            find . -type f \( -name '*.bin' -o -name '*.img' -o -name '*.tar.gz' -o -name '*.manifest' \) -print0 \
              | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          fi

      - name: Upload firmware and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-22.03-Xiaomi-CR6609
          path: |
            firmware-output/
            build.log
          if-no-files-found: warn
          retention-days: 14
