name: Build OpenWrt 22.03 - Xiaomi CR6609

on:
  workflow_dispatch:
  push:
    paths:
      - ".config"
      - "diy-part1.sh"
      - "diy-part2.sh"
      - ".github/workflows/build-22.03.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: cr6609-immortalwrt-22-03-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_REPO: https://github.com/openwrt/openwrt.git
  SOURCE_BRANCH: openwrt-22.03
  DEVICE_TARGET: ramips
  DEVICE_SUBTARGET: mt7621

jobs:
  build:
    name: Build CR6609 firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      # Free space before apt downloads package indexes.
      - name: Free runner disk space
        shell: bash
        run: |
          echo "Disk space before cleanup:"
          df -h /

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup

          sudo docker system prune -af || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "Disk space after cleanup:"
          df -h /

      - name: Expand build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          swap-size-mb: 2048
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -o Acquire::Languages=none
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-dev \
            python3-distutils python3-setuptools rsync swig time \
            unzip wget xsltproc zlib1g-dev file ccache ecj fastjar \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libreadline-dev libtool \
            libyaml-dev make patch pkgconf subversion \
            uglifyjs upx-ucl squashfs-tools
          sudo apt-get clean
          echo "Disk space after installing dependencies:"
          df -h /

      - name: Clone OpenWrt 22.03
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --single-branch \
            --branch "${SOURCE_BRANCH}" \
            "${SOURCE_REPO}" openwrt

          cd openwrt
          echo "OpenWrt revision:"
          git log -1 --oneline

      - name: Copy configuration and custom scripts
        shell: bash
        run: |
          set -euxo pipefail
          test -s .config || {
            echo "::error::.config is missing or empty in the repository root."
            exit 1
          }
          test -f diy-part1.sh || {
            echo "::error::diy-part1.sh is missing."
            exit 1
          }
          test -f diy-part2.sh || {
            echo "::error::diy-part2.sh is missing."
            exit 1
          }

          cp .config openwrt/.config
          chmod +x diy-part1.sh diy-part2.sh

      - name: Run DIY part 1
        working-directory: openwrt
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/diy-part1.sh"

      - name: Update and install feeds
        working-directory: openwrt
        shell: bash
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Run DIY part 2
        working-directory: openwrt
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/diy-part2.sh"

      - name: Configure build
        working-directory: openwrt
        shell: bash
        run: |
          grep -q '^CONFIG_TARGET_ramips=y' .config || {
            echo "::error::.config does not enable CONFIG_TARGET_ramips."
            exit 1
          }

          grep -q '^CONFIG_TARGET_ramips_mt7621=y' .config || {
            echo "::error::.config does not enable CONFIG_TARGET_ramips_mt7621."
            exit 1
          }

          make defconfig
          echo "Selected target configuration:"
          grep -E '^CONFIG_TARGET_(ramips|ramips_mt7621)|^CONFIG_TARGET_DEVICE' .config || true

      - name: Build firmware
        working-directory: openwrt
        shell: bash
        run: |
          # Keep parallelism modest to reduce memory pressure on hosted runners.
          make -j2 V=s

      # This step must not use working-directory: openwrt because the clone
      # may not exist when an earlier step fails.
      - name: Prepare firmware files
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/firmware-output"

          BUILD_DIR="$GITHUB_WORKSPACE/openwrt/bin/targets/${DEVICE_TARGET}/${DEVICE_SUBTARGET}"

          if [ -d "$BUILD_DIR" ]; then
            cp -a "$BUILD_DIR/." "$GITHUB_WORKSPACE/firmware-output/"
          else
            echo "Firmware output directory not found; an earlier build step may have failed."
          fi

          cd "$GITHUB_WORKSPACE/firmware-output"
          find . -type f \( -name '*.bin' -o -name '*.img' -o -name '*.tar.gz' \
            -o -name '*.manifest' -o -name 'sha256sums' \) -print

          find . -type f \( -name '*.bin' -o -name '*.img' -o -name '*.tar.gz' \
            -o -name '*.manifest' \) -print0 |
            sort -z |
            xargs -0 -r sha256sum > SHA256SUMS

      - name: Upload firmware artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-22.03-Xiaomi-CR6609
          path: firmware-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Show build failure hint
        if: failure()
        shell: bash
        run: |
          echo "Build failed. Inspect the first failed step above."
          echo "If dependency installation passes, check target settings and errors in diy-part1.sh / diy-part2.sh."
